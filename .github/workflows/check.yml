name: Check

# On main the deploy calls the checks before rollout, a separate run there would be a duplicate.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run check
      - run: npm test
      # The site is built on the server, but the build had better fail here.
      - run: npm run build
