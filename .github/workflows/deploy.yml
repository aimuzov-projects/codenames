name: Deploy

# A merge into main only updates the release PR. Merging that PR cuts a release,
# and the release goes to the server. A manual run deploys any release tag, e.g. to
# roll back.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Deploys run one at a time, a new one doesn't cut off a build already in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        uses: aimuzov-projects/infra-site-kit/release@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Until the server is prepared (key, clone in /srv, site in Caddy), the deploy is skipped.
  # Enabled by the repo variable DEPLOY_ENABLED=true. infra-site-template itself doesn't have it.
  deploy:
    needs: [release, check]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://codenames.aimuzov.online
    steps:
      - uses: aimuzov-projects/infra-site-kit/deploy@v1
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://codenames.aimuzov.online/
          ref: ${{ needs.release.outputs.tag || inputs.tag }}
