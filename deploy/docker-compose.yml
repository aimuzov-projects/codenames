# Игра на сервере projects. Порты 80/443 держит общий Caddy из aimuzov-projects/infra-server,
# он проксирует домен сюда по сети edge, а /ws -- релею комнат.

name: codenames

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: codenames
    container_name: codenames
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

  # Релей онлайн-комнат: пересылает сообщения между хостом и гостями, игровой логики в нём нет.
  relay:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: codenames-relay
    container_name: codenames-relay
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

# Переменные сборки лежат в /srv/codenames/.env, образец в .env.example.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
