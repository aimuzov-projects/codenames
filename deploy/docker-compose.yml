# The game on the projects server. Ports 80/443 are held by the shared Caddy from aimuzov-projects/infra-server,
# it proxies the domain here over the edge network, and /ws to the rooms relay.

name: codenames

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: codenames
    container_name: codenames
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

  # Online rooms relay: forwards messages between the host and guests, there's no game logic in it.
  relay:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: codenames-relay
    container_name: codenames-relay
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

# Build variables live in /srv/codenames/.env, the sample is in .env.example.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
