# nginx внутри контейнера codenames. TLS, сжатие и домен держит общий Caddy,
# сюда запросы приходят по сети edge уже расшифрованными.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # За прокси абсолютный редирект ушёл бы на http://codenames, отдаём относительный.
    absolute_redirect off;
    error_page 404 /404.html;

    # Хэшированные ассеты Astro неизменяемы, кешируем навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # В mime.types nginx нет webmanifest, без этого манифест PWA уходит как octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
