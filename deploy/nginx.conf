# nginx inside the codenames container. TLS, compression and the domain are on the shared Caddy,
# requests arrive here over the edge network already decrypted.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Behind a proxy an absolute redirect would go to http://codenames, so we send a relative one.
    absolute_redirect off;
    error_page 404 /404.html;

    # Hashed Astro assets are immutable, cache them forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx mime.types has no webmanifest, without this the PWA manifest goes out as octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
